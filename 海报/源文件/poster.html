<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--serif:"Noto Serif SC","Songti SC",serif;--brass:#e0c27a;--ink:#1b2230}
body{width:1240px;height:1860px;overflow:hidden;position:relative;background:#120d08 url(bg.png) center/cover no-repeat;font-family:var(--serif);color:#f6ecd6}
/* darken where text sits */
.shade{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(8,6,4,.15) 0%,rgba(8,6,4,0) 22%,rgba(8,6,4,.42) 38%,rgba(8,6,4,.3) 47%,rgba(8,6,4,0) 52%,rgba(8,6,4,.1) 66%,rgba(8,6,4,.72) 86%,rgba(8,6,4,.88) 100%)}
.head{position:absolute;top:655px;left:0;right:0;text-align:center}
.head .en{font:500 30px "Cinzel",var(--serif);letter-spacing:16px;color:var(--brass);text-shadow:0 2px 10px rgba(0,0,0,.7)}
.head h1{margin-top:18px;font:900 132px/1 var(--serif);letter-spacing:18px;text-indent:18px;text-shadow:0 6px 24px rgba(0,0,0,.75),0 2px 0 rgba(0,0,0,.5)}
.head .rule{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:26px;font:600 34px var(--serif);letter-spacing:8px;color:#f0dfb6;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.head .rule i{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--brass))}
.head .rule i:last-child{transform:scaleX(-1)}

/* four real game boxes standing on the table */
.boxes{position:absolute;left:0;right:0;top:1272px;height:0;perspective:1400px;perspective-origin:50% -1050px}
.box{position:absolute;left:50%;top:0;transform-style:preserve-3d}
.f{position:absolute;background:center/cover no-repeat}
.front{width:var(--w);height:var(--h);left:calc(var(--w) / -2);top:calc(var(--h) * -1);transform:translateZ(calc(var(--d) / 2));border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.front::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.18),transparent 35%)}
.side{width:var(--d);height:var(--h);left:calc(var(--d) / -2);top:calc(var(--h) * -1);background-size:4000% 100%;filter:brightness(.5)}
.r{transform:rotateY(90deg) translateZ(calc(var(--w) / 2));background-position:right center}
.l{transform:rotateY(-90deg) translateZ(calc(var(--w) / 2));background-position:left center}
.top{width:var(--w);height:var(--d);left:calc(var(--w) / -2);top:calc(var(--d) / -2);transform:translateY(calc(var(--h) * -1)) rotateX(90deg);background-size:100% 4000%;background-position:center top;filter:brightness(.85)}
.sh{position:absolute;width:calc(var(--w) * 1.3);height:calc(var(--d) * 2.6);left:calc(var(--w) * -.65);top:calc(var(--d) * -1.3);transform:rotateX(90deg);background:radial-gradient(ellipse,rgba(0,0,0,.8),transparent 70%)}

.qrcard{position:absolute;left:50%;top:1318px;width:364px;margin-left:-182px;padding:26px;border-radius:26px;background:linear-gradient(#f6ecd6,#e9dab8);
  box-shadow:0 20px 50px rgba(0,0,0,.65),0 0 0 3px rgba(224,194,122,.7)}
.qrcard img{display:block;width:100%;image-rendering:pixelated}
.logo{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:18px;background:#fff;padding:7px}
.logo svg{display:block;width:100%;height:100%}
.foot{position:absolute;left:0;right:0;top:1742px;text-align:center}
.foot b{display:block;font:900 42px var(--serif);letter-spacing:8px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.foot span{display:block;margin-top:10px;font:600 26px var(--serif);letter-spacing:4px;color:#e9d7ad;opacity:.9}
</style></head>
<body>
<div class="shade"></div>
<div class="head">
  <div class="en">LEISURECAT · TABLETOP</div>
  <h1>桌游小助手</h1>
  <div class="rule"><i></i>四款桌游 · 一个入口<i></i></div>
</div>

<div class="boxes" id="boxes"></div>

<div class="qrcard"><img src="qr.png" alt=""><div class="logo"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1b2230"/><rect x="14" y="14" width="36" height="36" rx="7" fill="#e0c27a"/><g fill="#1b2230"><circle cx="24" cy="24" r="4"/><circle cx="40" cy="24" r="4"/><circle cx="32" cy="32" r="4"/><circle cx="24" cy="40" r="4"/><circle cx="40" cy="40" r="4"/></g></svg></div></div>

<div class="foot">
  <b>扫码打开 · 选择这局要玩的游戏</b>
  <span>工业革命·匹兹堡　工业革命·伯明翰　奥丁的盛宴　惨剧轮回</span>
</div>

<script>
// real box proportions in cm (w × h × d), laid out left to right across the table
const U = 8.6;
const B = [
  { k: 'pgh',  w: 30,   h: 30, d: 8,  x: -410, z: -70, ry: 30 },
  { k: 'odin', w: 24.3, h: 34, d: 10, x: -140, z: 0,   ry: 11 },
  { k: 'bham', w: 30,   h: 30, d: 8,  x: 145,  z: 0,   ry: -11 },
  { k: 'tl',   w: 21.1, h: 29, d: 6,  x: 405,  z: -70, ry: -30 }
];
document.getElementById('boxes').innerHTML = B.map(b => {
  const img = `background-image:url(box-${b.k}.jpg)`;
  return `<div class="box" style="--w:${b.w * U}px;--h:${b.h * U}px;--d:${b.d * U}px;transform:translate3d(${b.x}px,0,${b.z}px) rotateY(${b.ry}deg)">
    <div class="sh"></div><div class="f side r" style="${img}"></div><div class="f side l" style="${img}"></div><div class="f top" style="${img}"></div><div class="f front" style="${img}"></div></div>`;
}).join('');
</script>
</body></html>
